<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0d1726" />
<meta name="description" content="게임 플레이어 행동·몰입·리텐션·UX를 연구한 논문을, 기획자 관점에서 검증하고 읽을 수 있는 연구 위키." />
<title>게임 기획 리뷰 — 2026.11.22</title>
<style>
  :root { --ink:#172339;--ink2:#3a4a5f;--muted:#718096;--main:#f5f7fb;--paper:#ffffff;--border:#e1e7f0;--sidebar:#111d2d;--violet:#7063e8;--violet-bg:#efecff;--blue:#2677d5;--blue-bg:#eaf3ff;--green:#16785f;--shadow:0 10px 32px rgba(18,36,68,.045);--radius:18px;--sans: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; font-family:var(--sans); background:var(--main); color:var(--ink); line-height:1.6; font-size:14px; }
  button,input,select { font:inherit; }
  button { cursor:pointer; }
  a { color:inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible,select:focus-visible { outline:3px solid #89a8ff;outline-offset:3px; }
  .layout { display:flex; min-height:100vh; }
  .sidebar { flex:0 0 250px; width:250px; background:var(--sidebar); color:#b7c4d6; display:flex; flex-direction:column; padding:27px 17px 22px; position:sticky;top:0;height:100vh; overflow-y:auto;z-index:10; }
  .brand { padding:2px 13px 30px; display:flex;gap:11px;align-items:center;text-decoration:none;}
  .brand-mark { height:36px;width:36px; background:linear-gradient(140deg,#8b7afb,#526ce7); color:white; border-radius:11px; display:grid;place-items:center;font-weight:900;font-size:21px;box-shadow:0 5px 16px #5865cf5c; }
  .brand b { display:block;font-size:16px; color:white; line-height:1.2;letter-spacing:-.4px; }
  .brand small { display:block;color:#778aa5;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;margin-top:4px; }
  .side-group { margin:5px 0 19px; }
  .side-label { display:block;padding:0 13px 9px; font-size:10px;font-weight:800;color:#73869e;letter-spacing:.14em; }
  .side-link { border:0;background:transparent;color:#aabbd0; width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0;font-size:13px;font-weight:600;transition:.18s; }
  .side-link svg { width:17px;height:17px;stroke-width:1.8; }
  .side-link:hover { background:#21334b;color:#f6f8fb; }
  .side-link.active { background:#30405f;color:white; }
  .side-count { margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;background:#22324a;color:#91a9cb; }
  .sidebar-spacer { flex:1; }
  .side-foot { border-top:1px solid #2c3a4c;margin:10px 7px 0;padding:18px 4px 0;color:#788ea7;font-size:11px;line-height:1.7; }
  .main { min-width:0; flex:1; }
  .masthead { height:69px;background:rgba(255,255,255,.83);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);padding:0 clamp(24px,4.5vw,70px); display:flex;align-items:center;justify-content:space-between;gap:20px; }
  .bread { font-size:12px;display:flex;align-items:center;gap:8px;color:#91a0b4; font-weight:600; }
  .bread b { color:#273b57;font-weight:700; }
  .header-right { display:flex;gap:12px;align-items:center;font-size:11px;color:#72839b; }
  .live { width:7px;height:7px;border-radius:50%;background:#2fbc92;box-shadow:0 0 0 4px #e7f7f1;display:inline-block; }
  .wrap { max-width:1410px; padding:39px clamp(24px,4.5vw,70px) 90px;margin:auto; }
  .eyebrow { text-transform:uppercase;color:#62779d;letter-spacing:.16em;font-size:10px;font-weight:900;display:flex;gap:9px;align-items:center; }
  .eyebrow::before { content:'';width:17px;height:2px;background:#7771f1;display:inline-block; }
  h1,h2,h3,h4,p { margin:0; }
  h1 { font-size:clamp(29px,3.2vw,43px); line-height:1.3; font-weight:850;letter-spacing:-1.9px;color:#142238; }
  h2 { font-size:21px;line-height:1.3;letter-spacing:-.8px; }
  h3 { font-size:17px;letter-spacing:-.55px;line-height:1.4; }
  .hero { border:1px solid #dbe3ef; border-radius:23px;background:linear-gradient(105deg,#ffffff 3%,#f5f4ff 66%,#ebf0ff 100%); padding:39px clamp(27px,3vw,49px); position:relative;overflow:hidden; box-shadow:var(--shadow); }
  .hero>*:not(.orb){position:relative;z-index:1;}
  .hero .orb { position:absolute;width:315px;height:315px;border:1px solid #d5d5fb;border-radius:50%;right:-90px;top:-125px;opacity:.9;box-shadow:0 0 0 44px #f0efff66,0 0 0 88px #f2f0ff55; }
  .hero h1 { margin:15px 0 14px;max-width:790px; }
  .hero p { color:#6d7b90;font-size:13px;max-width:650px;line-height:1.9; }
  .hero b.emph { color:#6e5fea; }
  .hero-pills { display:flex;flex-wrap:wrap;gap:8px;margin-top:24px; }
  .hero-pill { display:inline-flex;gap:7px;align-items:center;padding:7px 11px;background:#ffffffb5;border:1px solid #e3e6f2;border-radius:99px;font-size:11px;font-weight:700;color:#556684; }
  .hero-pill strong { color:#202d43;font-size:12px; }
  .section { margin-top:44px; }
  .sect-head { display:flex;align-items:end;justify-content:space-between; gap:20px;margin-bottom:20px; }
  .section-overline { letter-spacing:.13em;font-size:10px;color:#8c9bb1;font-weight:900;text-transform:uppercase;margin-bottom:8px; }
  .section-subtitle { margin-top:6px;font-size:12px;color:#8794a7; }
  .link-btn { border:0;background:transparent;color:#586ad6;font-size:12px;font-weight:800;padding:7px;white-space:nowrap; }
  .link-btn:hover{text-decoration:underline;}
  .cards { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px; }
  .card { background:var(--paper);border:1px solid var(--border); border-radius:18px;min-width:0;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow); transition:transform .16s,box-shadow .16s,border-color .16s; }
  .card:hover { transform:translateY(-3px);box-shadow:0 13px 38px #18294712;border-color:#c8d4ec; }
  .card:before { content:'';position:absolute;left:0;top:0;right:0;height:4px;background:#7968ec; }
  .card.blue:before { background:#4584db; }
  .card-body { padding:24px 22px 18px;flex:1;display:flex;flex-direction:column; }
  .card-top { display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:17px; }
  .category { font-weight:800;font-size:10px;letter-spacing:.03em;display:inline-flex;padding:5px 9px;border-radius:7px;background:var(--violet-bg);color:#6656bc; }
  .blue .category { background:var(--blue-bg);color:#3173bb; }
  .sub-meta { font-size:10.5px;color:#95a1b2;font-weight:600; white-space:nowrap; }
  .card h3 {font-size:17px;line-height:1.49;letter-spacing:-.6px;min-height:50px; }
  .card h3 button {border:0;background:transparent;color:inherit;text-align:left;padding:0;font-size:inherit;font-weight:850;line-height:inherit;letter-spacing:inherit; }
  .card h3 button:hover {color:#554ad0;}
  .card .description {font-size:12px;line-height:1.8;color:#77859b;margin:11px 0 17px;min-height:61px;}
  .tag-wrap {display:flex;gap:6px;flex-wrap:wrap; }
  .tag { border:1px solid #e3e9f0;background:#f7f9fc;color:#63758f;padding:4px 9px;border-radius:7px;font-size:10px;font-weight:750;line-height:1.4; }
  button.tag:hover { color:#5145b5;border-color:#cac6ef;background:#f3f0ff; }
  .card-bottom {display:flex;align-items:center;justify-content:space-between;border-top:1px solid #edf0f5;padding:13px 22px 14px;gap:8px; }
  .card-bottom .foot-note {font-size:10px;color:#8c9aaf;}
  .card-bottom button {background:transparent;border:0;color:#5962ce;font-size:11px;font-weight:850;white-space:nowrap;padding:4px 0;}
  .card-bottom button:hover{text-decoration:underline;}
  .chipline { display:flex;gap:6px;align-items:center;flex-wrap:wrap; }
  .new-stamp {font-size:9px;color:#df7650; font-weight:900;letter-spacing:.07em;margin-left:3px; }
  .best-badge {display:inline-flex;align-items:center;justify-content:center;gap:3px;border:1px solid #c99a42;background:#fff4d9;color:#815311;border-radius:7px;padding:5px 8px;font-size:10px;line-height:1.2;font-weight:900;letter-spacing:.03em;white-space:nowrap;}
  .best-badge:hover,.best-badge:focus-visible {background:#f9e8b6;border-color:#b27d29;}
  .best-award {background:#fffaf0;border:1px solid #edd9ac;border-radius:12px;padding:14px 17px;margin-top:18px;color:#5f4c24;font-size:12px;line-height:1.8;}
  .best-award strong {display:block;font-size:13px;color:#76510b;margin-bottom:4px;}
  .best-award a {color:#815311;font-weight:800;text-underline-offset:3px;}
  .best-award a:hover {color:#583600;}
  .filter-tag.best-filter {background:#fff9ec;border-color:#edd9ac;color:#805811;}
  .filter-tag.best-filter.active {background:#fce9b9;border-color:#d2a248;color:#664008;}
  .filter-bar { display:flex; gap:9px;align-items:center; flex-wrap:wrap;margin-top:16px;margin-bottom:18px; }
  .searchbox { flex:1 1 250px;display:flex;align-items:center;gap:8px;height:41px;border:1px solid var(--border);border-radius:10px;background:white;padding:0 13px;color:#8799af; }
  .searchbox:focus-within {border-color:#8c83ee;box-shadow:0 0 0 3px #e9e6ff;}
  .searchbox input {border:0;outline:0;min-width:0;width:100%;color:#29354a;font-size:12px;background:transparent;}
  .searchbox input::placeholder {color:#a1adbd;}
  .select {border:1px solid var(--border);background:white;border-radius:10px;height:41px;padding:0 32px 0 12px;color:#51627b;font-size:11px;font-weight:700;min-width:122px;}
  .all-header {display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:#8493a8;margin-bottom:14px;}
  .filter-tags {display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px;}
  .filter-tag {border:1px solid #e1e7f0;background:white;padding:6px 10px;border-radius:99px;color:#6e809a;font-size:10px;font-weight:700;}
  .filter-tag:hover,.filter-tag.active{background:#eae8ff;border-color:#c7c1fa;color:#5b50ba;}
  .clear {border:0;background:none;color:#7262e0;font-weight:750;font-size:11px;padding:5px;}
  .empty {grid-column:1/-1;border:1px dashed #ccd6e3;background:#ffffffaf;padding:50px 20px;text-align:center;border-radius:14px;color:#708098;}
  .empty strong {display:block;color:#34445b;margin:10px 0 4px;font-size:16px;}
  .footer {margin-top:75px;padding-top:21px;border-top:1px solid #dce3ef;font-size:11px;color:#97a3b6;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .icon {height:17px;width:17px;display:inline-block;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .back-button {font-size:12px;color:#5868a3;font-weight:800;border:0;background:none;padding:0;margin:0 0 23px;display:inline-flex;align-items:center;gap:5px;}
  .detail-header {border:1px solid var(--border);background:white;border-radius:20px;padding:33px 36px;box-shadow:var(--shadow);}
  .detail-header h1 {font-size:clamp(25px,3vw,37px);max-width:860px;margin:15px 0 13px;}
  .detail-header p {color:#62738c; font-size:13px;line-height:1.8;}
  .detail-meta {display:flex;flex-wrap:wrap;gap:16px;margin:18px 0;font-size:11px;color:#8b98aa;}
  .detail-meta strong {color:#52637a;}
  .detail-body { display:grid;grid-template-columns:minmax(0,1fr) 211px; gap:27px; margin-top:28px;align-items:start; }
  .article {min-width:0;}
  .paper-section {background:white;border:1px solid var(--border);border-radius:17px;margin-bottom:19px;padding:27px 29px;box-shadow:var(--shadow);scroll-margin-top:25px;}
  .paper-section h2 {font-size:20px;margin-bottom:17px;display:flex;gap:10px;align-items:center;}
  .section-num {font-size:11px;border-radius:8px;color:#6658d4;background:#f1efff;font-weight:900;padding:5px 8px;letter-spacing:0;}
  .paper-section h3 {font-size:14px;margin:23px 0 10px;}
  .paper-section p {color:#4f6078;font-size:12.6px;line-height:1.95;margin:9px 0;}
  .paper-table-wrap {overflow:auto;max-width:100%;border:1px solid #e7ebf2;border-radius:12px;margin:14px 0;}
  .paper-table {width:100%;border-collapse:collapse;font-size:12px;min-width:420px;}
  .paper-table th {background:#f4f6fa;color:#64758b;font-size:11px;text-align:left;font-weight:850;padding:11px 13px;}
  .paper-table td {padding:12px 13px;color:#3e4d64;vertical-align:top;border-top:1px solid #e9edf3;line-height:1.75;}
  .paper-table td:first-child {font-weight:800;color:#263b56;white-space:nowrap;}
  .paper-table tbody tr:hover {background:#fafaff;}
  .summary-table {min-width:0;}
  .summary-table td:first-child {width:124px;white-space:normal;}
  .insight {border-radius:11px;padding:15px 17px;background:#f6f4ff;border:1px solid #e8e5ff;margin:15px 0;}
  .insight.green {background:#edf8f5;border-color:#d8eee7;}
  .insight.gold {background:#fff9ee;border-color:#faeed8;}
  .insight .insight-label {font-size:10px;letter-spacing:.08em;font-weight:900;color:#6859c3;margin-bottom:6px;}
  .insight.green .insight-label {color:#198168;}
  .insight.gold .insight-label {color:#ae8435;}
  .insight p {margin:0;font-size:12.5px;line-height:1.85;color:#44516c;}
  .info-stack {display:grid;gap:10px;}
  .info-block {background:#f8fafd;border:1px solid #e9eef5;padding:15px;border-radius:11px;}
  .info-block strong {color:#293b55;font-size:12.5px;}
  .info-block p {margin:6px 0 0;font-size:12px;}
  .tiny-muted {font-size:11px!important;color:#8390a4!important;}
  .charts {display:grid;gap:9px;margin:17px 0 20px;}
  .chart-row {display:grid;grid-template-columns:113px 1fr 50px;align-items:center;gap:10px;}
  .chart-name {font-size:11px;color:#6b7a91;font-weight:700;}
  .chart-track {height:9px;background:#eceffa;border-radius:99px;overflow:hidden;}
  .chart-fill {height:100%;background:linear-gradient(90deg,#9a86fa,#6656d9);border-radius:99px;}
  .chart-value {font-size:11px;color:#5964a3;font-weight:850;font-variant-numeric:tabular-nums;text-align:right;}
  .metric-kpi {font-size:44px;font-weight:900;letter-spacing:-2px;color:#486fd3;line-height:1.15;}
  .experiment {padding:18px;border:1px solid #dfe7f1;background:#fbfcff;border-radius:12px;margin:13px 0;}
  .experiment h4 {font-size:14px;margin-bottom:6px;}
  .experiment dl {display:grid;grid-template-columns:85px 1fr;gap:8px 15px;font-size:11.5px;margin:12px 0 0;line-height:1.8;}
  .experiment dt {font-weight:850;color:#667b98;}
  .experiment dd {margin:0;color:#41516a;}
  .toc {position:sticky;top:20px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 14px;}
  .toc b {display:block;font-size:10px;letter-spacing:.12em;color:#8090aa;margin-bottom:12px;padding-left:6px;}
  .toc a {display:block;font-size:11.5px;color:#60718a;text-decoration:none;padding:9px 7px;border-radius:8px;line-height:1.45;}
  .toc a:hover {background:#f5f4ff;color:#6455c9;}
  .source-link {border:1px solid #d9e0eb;background:white;color:#4e5d81;text-decoration:none;font-weight:750;font-size:11px;padding:9px 12px;border-radius:9px;display:inline-flex;gap:6px;align-items:center;margin:4px 6px 3px 0;}
  .source-link:hover {border-color:#a9ade6;color:#5549c7;}
  .mobile-nav {display:none;}
  @media (max-width:1200px) { .cards {grid-template-columns:repeat(2,minmax(0,1fr));} .sidebar {flex-basis:215px;width:215px;} .wrap {padding:31px 26px 70px;} .masthead {padding:0 26px;} }
  @media (max-width:920px) { .sidebar {display:none;} .masthead {height:62px;} .mobile-nav{display:flex;align-items:center;gap:9px;font-weight:900;color:#222e45;font-size:13px;} .detail-body {grid-template-columns:1fr;} .toc {display:none;} }
  @media (max-width:650px) { .wrap{padding:20px 15px 55px;} .masthead{padding:0 16px;} .hero{padding:27px 22px;border-radius:16px;} .hero h1{font-size:29px;letter-spacing:-1.3px;} .cards{grid-template-columns:1fr;} .section{margin-top:35px;} .filter-bar .select {flex:1 1 44%;} .filter-bar .searchbox{flex-basis:100%;} .detail-header{padding:22px 19px;} .paper-section{padding:21px 17px;} .detail-header h1{font-size:25px;} .header-right{font-size:10px;} .masthead .bread{display:none;} .chart-row{grid-template-columns:91px 1fr 40px;} .card h3{min-height:0;} .card .description{min-height:0;} .hero .orb{opacity:.25;} .summary-table td:first-child{width:85px;} }
  @media (prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important;}}

  /* 02. 연구의 기획 활용을 먼저 이해하는 인사이트 요약 */
  .eval-lead {background:#f3f6fc;border:1px solid #dbe3f0;border-left:4px solid #6d74d9;border-radius:12px;padding:21px 22px;margin:12px 0 21px;}
  .eval-eyebrow {font-size:11px;letter-spacing:.05em;font-weight:850;color:#5467a7;margin-bottom:9px;}
  .paper-section .eval-lead p {font-size:15px;font-weight:800;line-height:1.75;color:#263752;margin:0;letter-spacing:-.25px;}
  .eval-lessons {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:13px 0 24px;}
  .eval-lesson {border:1px solid #e3e9f2;border-radius:12px;background:#fbfcff;padding:16px 15px;min-width:0;}
  .eval-number {font-size:10px;color:#776bd6;font-weight:900;letter-spacing:.08em;display:block;margin-bottom:8px;}
  .eval-lesson strong {display:block;font-size:13px;line-height:1.5;color:#22334d;letter-spacing:-.4px;}
  .paper-section .eval-lesson p {font-size:11.6px;line-height:1.8;margin:9px 0 0;color:#596a82;}
  .eval-scenario {display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:13px 0 24px;}
  .eval-scenario-item {padding:17px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;}
  .eval-scenario-item.action {background:#edf7f4;border-color:#d5eae3;}
  .eval-scenario-item b {font-size:11px;color:#71849e;display:block;margin-bottom:9px;}
  .eval-scenario-item.action b {color:#16745f;}
  .paper-section .eval-scenario-item p {font-size:12px;color:#33445c;line-height:1.85;margin:0;}
  .eval-metrics {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0 21px;}
  .eval-metric {padding:12px 13px;border-radius:10px;border:1px solid #e5eaf3;background:#fafbfe;}
  .eval-metric strong {font-size:11.5px;display:block;color:#354766;}
  .eval-metric span {color:#7d8ca1;font-size:10.5px;display:block;margin-top:4px;}
  .eval-boundary {border-top:1px dashed #e0e6ef;padding-top:18px;margin-top:7px;}
  .eval-boundary dl {display:grid;grid-template-columns:104px 1fr;gap:9px 12px;margin:0;}
  .eval-boundary dt {font-size:11px;font-weight:850;color:#667b98;}
  .eval-boundary dd {font-size:11.5px;line-height:1.8;color:#54667e;margin:0;}
  .eval-bottom {font-size:13px;font-weight:850;color:#243854;border-top:1px solid #e8edf4;margin-top:18px;padding-top:16px;line-height:1.8;}
  @media (max-width:1100px){.eval-lessons{grid-template-columns:1fr;}}
  @media (max-width:650px){.eval-scenario,.eval-metrics{grid-template-columns:1fr;}.eval-lead{padding:17px;}.paper-section .eval-lead p{font-size:14px;}.eval-boundary dl{grid-template-columns:1fr;gap:3px;}.eval-boundary dd{margin-bottom:10px;}}

  /* 02. 검증 결과 → 근거가 있는 해석 → 친숙한 예시 */
  .evidence-list {display:grid;grid-template-columns:1fr;gap:11px;margin:14px 0 27px;}
  .evidence-item {background:#fff;border:1px solid #dfe7f0;border-radius:12px;padding:17px 19px;display:grid;grid-template-columns:minmax(108px,160px) 1fr;align-items:start;gap:16px;}
  .evidence-stat {color:#5f54bb;font-size:16px;line-height:1.4;font-weight:900;letter-spacing:-.5px;}
  .evidence-title {font-weight:850;font-size:13px;color:#22354d;}
  .paper-section .evidence-description {font-size:12px;line-height:1.85;color:#52647e;margin:6px 0;}
  .evidence-cite {display:inline-block;font-size:10.5px;color:#6175a0;text-decoration:underline;text-decoration-color:#b8c8e7;text-underline-offset:3px;margin-top:5px;}
  .interpretation-list {display:grid;gap:13px;margin:14px 0 18px;}

function filtered(){let list=[...papers];if(state.mode==='saved')list=list.filter(p=>saved.includes(p.id));if(state.mode==='new')list=sortedByUpdated().slice(0,3);if(state.tag)list=list.filter(p=>state.tag==='BEST'?Boolean(p.best):p.tags.includes(state.tag));if(state.data!=='all')list=list.filter(p=>p.dataType===state.data);if(state.domain!=='all')list=list.filter(p=>p.domain===state.domain);if(state.method!=='all')list=list.filter(p=>p.researchType===state.method);if(state.search.trim()){const q=state.search.toLocaleLowerCase();list=list.filter(p=>[p.title,p.originalTitle,p.kicker,p.finding,p.dataSummary,p.methodSummary,...(p.best?['BEST',p.best.award]:[]),...p.tags].join(' ').toLocaleLowerCase().includes(q));}list.sort((a,b)=>state.sort==='title'?a.title.localeCompare(b.title,'ko'):state.sort==='published'?b.published.localeCompare(a.published):b.updated.localeCompare(a.updated)||b.published.localeCompare(a.published));return list;}

const rowTable=(rows,headers=null,summary=false)=>`<div class="paper-table-wrap"><table class="paper-table ${summary?'summary-table':''}">${headers?`<thead><tr>${headers.map(x=>`<th>${e(x)}</th>`).join('')}</tr></thead>`:''}<tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const insight=(label,body,color='')=>`<div class="insight ${color}"><div class="insight-label">${e(label)}</div><p>${e(body)}</p></div>`;
function detail(p){refreshNav();document.getElementById('breadcrumbs').innerHTML=`<b>게임 기획 리뷰</b><span>/</span> ${e(p.domain)} <span>/</span> 상세 분석`;const anchor=(k,title)=>`<a href="#section-${k}" data-action="scroll-section" data-target="section-${k}">${e(title)}</a>`;let html=`<div class="wrap"><button class="back-button" data-action="back">${icon('back')} 전체 연구로 돌아가기</button><header class="detail-header"><div class="eyebrow">RESEARCH DEEP DIVE · ${e(p.researchType)}</div><h1>${e(p.title)}</h1><p>${e(p.kicker)}</p><div class="detail-meta"><span><strong>출처</strong> · ${e(p.journal)}</span><span><strong>발표</strong> · ${date(p.published)}</span><span><strong>데이터</strong> · ${e(p.dataType)}</span><span><strong>분석 메모</strong> · ${e(p.confidence)}</span></div>${p.best?`<div class="best-award"><button class="best-badge" data-action="filter-tag" data-tag="BEST" title="BEST 선정 연구만 보기">★ BEST</button><strong style="margin-top:8px">${e(p.best.award)}</strong>선정 근거: <a href="${e(p.best.evidenceUrl)}" target="_blank" rel="noopener noreferrer">${e(p.best.evidenceName)}</a></div>`:''}<div class="tag-wrap" style="margin-top:16px">${p.tags.map(t=>`<button class="tag" data-action="filter-tag" data-tag="${e(t)}">#${e(t)}</button>`).join('')}</div><div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:20px;"><button class="source-link" data-action="save" data-id="${e(p.id)}">${icon('bookmark')} ${saved.includes(p.id)?'저장 해제':'읽기 목록에 저장'}</button><a class="source-link" href="${e(p.sourceUrl)}" target="_blank" rel="noopener noreferrer">${icon('external')} 논문 원문</a></div></header><div class="detail-body"><div class="article">`;
html+=`<section class="paper-section" id="section-summary"><h2><span class="section-num">01</span> 한눈에 보는 연구 요약</h2>${rowTable(p.summaryRows,null,true)}<div class="insight green"><div class="insight-label">연구가 실제로 확인한 핵심</div><p>${e(p.finding)}</p></div></section>`;
html+=`<section class="paper-section" id="section-eval"><h2><span class="section-num">02</span> 눈여겨볼 결과와 그 의미</h2><div class="eval-lead"><div class="eval-eyebrow">핵심 결론</div><p>${e(p.evaluation.lead)}</p></div><h3>실제 데이터에서 확인된 결과</h3><p class="interpretation-footnote">아래에는 논문의 정량 분석·실험 비교·질적 관찰 결과를 구분해 정리했다. 통계적 관련성이 곧 인과관계는 아니다.</p><div class="evidence-list">${p.evaluation.highlights.map(x=>`<div class="evidence-item"><div class="evidence-stat">${e(x.stat)}</div><div><div class="evidence-title">${e(x.title)}</div><p class="evidence-description">${e(x.plain)}</p><a class="evidence-cite" href="${e(p.sourceUrl)}" target="_blank" rel="noopener noreferrer">논문 근거 · ${e(x.source)}</a></div></div>`).join('')}</div><h3>결과에서 도출한 기획적 인사이트</h3><p class="interpretation-footnote">연구 근거 → 해석의 이유 → 이해를 돕는 게임 사례 순서로 구분했다. 연구에서 입증하지 않은 것은 단정하지 않는다.</p><div class="interpretation-list">${p.evaluation.interpretations.map((x,i)=>`<div class="interpretation-item"><h4>${i+1}. ${e(x.title)}</h4><div class="reasoning-step"><b>연구에서 확인한 근거</b><p>${e(x.observed)}</p></div><div class="reasoning-step"><b>이 근거에서 도출한 해석</b><p>${e(x.reasoning)}</p></div><div class="reasoning-step example"><b>게임 속 사례</b><p>${e(x.example)}</p></div><p class="interpretation-boundary">해석의 범위: ${e(x.boundary)}</p></div>`).join('')}</div>${p.evaluation.designComparison?`<div class="design-comparison"><h3>${e(p.evaluation.designComparison.title)}</h3><p class="interpretation-footnote">기획적 해석 · 논문에서 직접 비교 검증한 결과가 아님</p><p>${e(p.evaluation.designComparison.basis)}</p>${rowTable(p.evaluation.designComparison.rows,p.evaluation.designComparison.headers)}${insight('추천 운영 지표 · 기획 제안',p.evaluation.designComparison.metric)}<p class="interpretation-boundary">${e(p.evaluation.designComparison.boundary)}</p></div>`:''}<p class="eval-bottom">기획자가 기억할 결론 · ${e(p.evaluation.takeaway)}</p></section>`;
html+=`<section class="paper-section" id="section-purpose"><h2><span class="section-num">03</span> 연구 주제와 목적</h2><p>${e(p.kicker)}</p>${insight('연구 질문',p.summaryRows[0][1])}<h3>논문 정보</h3><p>${e(p.originalTitle)}<br>${e(p.authors)}<br>${e(p.journal)} · DOI ${e(p.doi)}</p></section>`;
html+=`<section class="paper-section" id="section-variables"><h2><span class="section-num">04</span> 변수의 정확한 정의</h2><p>연구자가 무엇을 측정했는지 확인해야 연구 결과를 올바르게 읽을 수 있어.</p>${rowTable(p.variables,['변수','연구에서 뜻하는 내용','해석할 때 주의할 점'])}</section>`;
html+=`<section class="paper-section" id="section-data"><h2><span class="section-num">05</span> 어떤 데이터를 사용했나?</h2><p>${e(p.dataSummary)}</p>${insight('데이터를 읽을 때',p.dataCaveat||(p.dataType==='설문'?'실제 접속 기록이 아닌 설문 기반 자기보고 자료이다.':'실제 게임 행동 데이터를 분석했지만 원문의 측정 범위를 확인하고 해석해야 한다.'),'gold')}</section>`;
html+=`<section class="paper-section" id="section-method"><h2><span class="section-num">06</span> 분석 방법과 사용 이유</h2><p>${e(p.methodSummary)}</p><div class="info-stack">${p.methodDetails.map(m=>`<div class="info-block"><strong>${e(m.title)}</strong><p>${e(m.body)}</p></div>`).join('')}</div><h3>결과 수치를 읽는 법</h3>${rowTable(p.metricExplanations,['지표','쉽게 이해하는 방법'])}</section>`;
html+=`<section class="paper-section" id="section-results"><h2><span class="section-num">07</span> 실제 분석 결과</h2>`;
if(p.id==='dynamic-group-churn-2026')html+='<div class="metric-kpi">98.2%</div><p class="tiny-muted">논문 초록·하이라이트에 보고된 최고 분류 정확도. 이탈자의 비율과 정밀도·재현율 확인 전에는 실서비스 성능이라고 평가할 수 없어.</p>';
html+=p.results.map((r,i)=>`<h3>${i+1}. ${e(r.title)}</h3>${r.chart?`<div class="charts">${r.chart.map(x=>`<div class="chart-row"><span class="chart-name">${e(x.name)}</span><div class="chart-track"><div class="chart-fill" style="width:${Math.min(100,x.value/.6*100)}%"></div></div><span class="chart-value">${x.value.toFixed(3)}</span></div>`).join('')}</div>`:''}${rowTable(r.rows,r.columns)}${insight('결과를 해석할 때',r.note,'gold')}`).join('')+'</section>';
html+=`<section class="paper-section" id="section-use"><h2><span class="section-num">08</span> 게임 기획·운영에 적용</h2>${insight('논문으로 확인된 사실',p.finding,'green')}${insight('기획자의 해석 / 검증해야 할 가설',p.useCase)}${p.suggestedMetrics?`<h3>라이브 서비스용 제안 지표</h3><p class="tiny-muted">아래 계산식은 논문의 변수를 그대로 재현한 것이 아니라 게임 운영용으로 제안한 것이야.</p>${rowTable(p.suggestedMetrics,['제안 지표','계산 방법'])}`:''}<h3>직접 검증해 볼 실험</h3>${p.experiments.map((x,i)=>`<div class="experiment"><h4>${i+1}. ${e(x.title)}</h4><p>${e(x.hypothesis)}</p><dl><dt>기존군 / 모델</dt><dd>${e(x.control)}</dd><dt>실험군 / 모델</dt><dd>${e(x.treatment)}</dd><dt>주요 지표</dt><dd>${e(x.primary)}</dd><dt>가드레일</dt><dd>${e(x.guardrail)}</dd></dl></div>`).join('')}</section>`;
html+=`<section class="paper-section" id="section-limits"><h2><span class="section-num">09</span> 한계와 출처</h2>${insight('연구의 한계',p.limitation,'gold')}<h3>원문 및 출처</h3><div>${p.citations.map(c=>`<a href="${e(c.url)}" class="source-link" target="_blank" rel="noopener noreferrer">${icon('external')} ${e(c.label)}</a>`).join('')}</div><p class="tiny-muted">이 페이지는 연구 결과를 해석한 2차 요약 자료이며, 논문 원문과는 별개의 기획적 해석 및 제안 실험을 포함합니다. 모든 수치를 인과관계로 해석하지 마세요.</p></section>`;
html+=`</div><nav class="toc" aria-label="상세 목차"><b>ON THIS PAGE</b>${[['summary','연구 요약'],['eval','기획 인사이트'],['purpose','주제와 목적'],['variables','변수 정의'],['data','사용 데이터'],['method','분석 방법'],['results','실제 결과'],['use','기획·운영 활용'],['limits','한계와 출처']].map(x=>anchor(...x)).join('')}</nav></div><footer class="footer"><span>게임 기획 리뷰 · 논문의 사실과 기획적 가설을 구분합니다.</span><span>원문 출처 표기 포함</span></footer></div>`;
document.getElementById('content').innerHTML=html;window.scrollTo(0,0);}
function goHome(){location.hash='#home';}
function route(){setMobileMenu(false);let hash=decodeURIComponent(location.hash||'#home');if(hash.startsWith('#paper/')){const p=papers.find(x=>x.id===hash.slice(7));if(p){detail(p);return;}}home();window.scrollTo(0,0);}
const reset=()=>{state.search='';state.tag='';state.data='all';state.domain='all';state.method='all';state.sort='updated';};
document.addEventListener('click',event=>{
 const t=event.target.closest('[data-action]');
 if(!t){if(!event.target.closest('#mobile-menu'))setMobileMenu(false);return;}
 const action=t.dataset.action;
 if(action==='toggle-mobile-menu'){const menu=document.getElementById('mobile-menu');setMobileMenu(menu.hidden);return;}
 if(action==='nav-home'||action==='nav-new'||action==='nav-saved')setMobileMenu(false);
 if(action==='open-paper'){location.hash='#paper/'+t.dataset.id;return;}
if(action==='back'){goHome();return;}
if(action==='nav-home'||action==='nav-new'||action==='nav-saved'){reset();state.mode=action==='nav-new'?'new':action==='nav-saved'?'saved':'all';goHome();if(location.hash==='#home')home();return;}
if(action==='filter-tag'||action==='filter-domain'){const tag=t.dataset.tag||'',domain=t.dataset.domain||'all';reset();state.mode='all';if(action==='filter-tag')state.tag=tag;else state.domain=domain;location.hash='#home';home();document.getElementById('library-section')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
if(action==='reset-filters'){reset();home();document.getElementById('library-section')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
if(action==='save'){const id=t.dataset.id;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];try{localStorage.setItem(savedKey,JSON.stringify(saved));}catch{};detail(papers.find(x=>x.id===id));return;}
if(action==='scroll-section'){event.preventDefault();document.getElementById(t.dataset.target)?.scrollIntoView({behavior:'smooth'});return;}
});
document.addEventListener('input',ev=>{if(ev.target.id==='search-input'){state.search=ev.target.value;list();}});
document.addEventListener('change',ev=>{if(ev.target.id==='domain-select'){state.domain=ev.target.value;list();}if(ev.target.id==='data-select'){state.data=ev.target.value;list();}if(ev.target.id==='sort-select'){state.sort=ev.target.value;list();}});
window.addEventListener('hashchange',route);document.addEventListener('keydown',event=>{if(event.key==='Escape')setMobileMenu(false);});window.addEventListener('resize',()=>{if(window.innerWidth>920)setMobileMenu(false);});route();
})();
</script>
</body>
</html>
